name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:

    environment: production
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        run: terraform -chdir=terraform plan
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get Instance IP
        id: get_ip
        run: |
          IP=$(terraform -chdir=terraform output -raw instance_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Get Instance Password
        id: get_password
        run: |
          PASSWORD=$(terraform -chdir=terraform output -json vm_passwords | jq -r '.[keys[0]]')
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Read Deployment Inputs
        id: deployment_inputs
        run: |
      
          echo "cpu=4" >> $GITHUB_OUTPUT
          echo "ram=8GB" >> $GITHUB_OUTPUT
          echo "workload=database" >> $GITHUB_OUTPUT
          echo "os=ubuntu" >> $GITHUB_OUTPUT
          

      - name: Generate AI Suggestion
        id: aisuggestion
        shell: bash
      
        env:
          CPU: ${{ steps.deployment_inputs.outputs.cpu }}
          RAM: ${{ steps.deployment_inputs.outputs.ram }}
          WORKLOAD: ${{ steps.deployment_inputs.outputs.workload }}
          OS: ${{ steps.deployment_inputs.outputs.os }}
      
        run: |
      
          PROMPT="Linode VM deployment configuration:
          CPU: $CPU
          RAM: $RAM
          OS: $OS
          Workload: $WORKLOAD"
      
          RESPONSE=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "gpt-4.1-mini",
              messages: [
                {
                  role: "system",
                  content: "You are a senior cloud architect. Provide exactly 3 short operational recommendations separated by commas only. No numbering."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.3
            }' | curl -s https://api.openai.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
              -d @-)
      
          echo "$RESPONSE"
      
          AI_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
      
          echo "suggestion<<EOF" >> $GITHUB_OUTPUT
          echo "$AI_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IP: ${{ steps.get_ip.outputs.ip }}
          PASSWORD: ${{ steps.get_password.outputs.password }}
          AI: ${{ steps.aisuggestion.outputs.suggestion }}
      
        run: |
      
          TEXT=":white_check_mark: *Linode successfully created!*
      
          :earth_africa: *Public IP:*
          $IP
      
          :closed_lock_with_key: *SSH Access:*
          ssh root@$IP
      
          :shield: *Root Password:*
          $PASSWORD
      
          :bulb: *AI Suggestion:*
          $AI"
      
          jq -n \
            --arg text "$TEXT" \
            '{
              text: "Deployment Success!",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $text
                  }
                }
              ]
            }' > slack.json
      
          cat slack.json
      
          curl -X POST \
            -H "Content-type: application/json" \
            --data @slack.json \
            "$SLACK_WEBHOOK_URL"
