name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:

    environment: production
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        run: terraform -chdir=terraform plan
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get Instance IP
        id: get_ip
        run: |
          IP=$(terraform -chdir=terraform output -raw instance_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Get Instance Password
        id: get_password
        run: |
          PASSWORD=$(terraform -chdir=terraform output -json vm_passwords | jq -r '.[keys[0]]')
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT


      - name: Notify Slack
        if: success()
        run: |
          IP=$(terraform -chdir=terraform output -raw instance_ip)
          PASSWORD=${{ steps.get_password.outputs.password }}
      
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": ":rocket: Deployment Success!\n*Service:* linode-vm\n*External IP:* '${IP}'\n*Root Password:* '${PASSWORD}'\n*URL:* http://'${IP}'"
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
