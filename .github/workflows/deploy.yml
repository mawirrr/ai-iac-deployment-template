name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:

    environment: production
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        run: terraform -chdir=terraform plan
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get Instance IP
        id: get_ip
        run: |
          IP=$(terraform -chdir=terraform output -raw instance_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Get Instance Password
        id: get_password
        run: |
          PASSWORD=$(terraform -chdir=terraform output -json vm_passwords | jq -r '.[keys[0]]')
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Read Deployment Inputs
        id: deployment_inputs
        shell: bash
        run: |
      
          LAST_LINE=$(tail -n 1 input/request.csv)
      
          IFS=',' read -r TIMESTAMP SERVICE REGION IMAGE PLAN LABEL TAGS PASSWORD CLUSTER K8S_REGION K8S_VERSION K8S_NODE_COUNT <<< "$LAST_LINE"
      
          OS=$(basename "$IMAGE")
          if [[ "$REGION" == "sg-sin-2" ]]; then
            REGION_NAME="Singapore"
          
          elif [[ "$REGION" == "id-cgk" ]]; then
            REGION_NAME="Jakarta"
          
          elif [[ "$REGION" == "jp-osa" ]]; then
            REGION_NAME="Osaka"
          
          else
            REGION_NAME="$REGION"
          fi
      
          if [[ "$PLAN" == "g6-nanode-1" ]]; then
            CPU="1"
            RAM="1GB"
          elif [[ "$PLAN" == "g6-standard-1" ]]; then
            CPU="1"
            RAM="2GB"
          elif [[ "$PLAN" == "g6-standard-2" ]]; then
            CPU="2"
            RAM="4GB"
          else
            CPU="unknown"
            RAM="unknown"
          fi
          if [[ "$PLAN" == "g6-nanode-1" ]]; then
            PLAN_RISK="Low-memory shared instance may experience performance bottlenecks under sustained workloads."
          
          elif [[ "$PLAN" == "g6-standard-1" ]]; then
            PLAN_RISK="Entry-level compute may limit scaling during peak traffic."
          
          else
            PLAN_RISK="General-purpose configuration appears balanced for moderate workloads."
          fi
      
          LABEL_LOWER=$(echo "$LABEL" | tr '[:upper:]' '[:lower:]')
          
          if [[ "$LABEL_LOWER" == *"db"* ]]; then
            WORKLOAD="database"
          
          elif [[ "$LABEL_LOWER" == *"web"* ]]; then
            WORKLOAD="web"
          
          elif [[ "$LABEL_LOWER" == *"ai"* ]]; then
            WORKLOAD="ai"
          
          elif [[ "$LABEL_LOWER" == *"dev"* ]]; then
            WORKLOAD="dev"
          
          else
            WORKLOAD="general"
          fi
      
          echo "cpu=$CPU" >> $GITHUB_OUTPUT
          echo "ram=$RAM" >> $GITHUB_OUTPUT
          echo "workload=$WORKLOAD" >> $GITHUB_OUTPUT
          echo "os=$OS" >> $GITHUB_OUTPUT
          echo "region=$REGION_NAME" >> $GITHUB_OUTPUT
          echo "plan_risk=$PLAN_RISK" >> $GITHUB_OUTPUT
          

      - name: Generate AI Suggestion
        id: aisuggestion
        shell: bash
      
        env:
          CPU: ${{ steps.deployment_inputs.outputs.cpu }}
          RAM: ${{ steps.deployment_inputs.outputs.ram }}
          WORKLOAD: ${{ steps.deployment_inputs.outputs.workload }}
          OS: ${{ steps.deployment_inputs.outputs.os }}
          REGION: ${{ steps.deployment_inputs.outputs.region }}
          PLAN_RISK: ${{ steps.deployment_inputs.outputs.plan_risk }}
      
        run: |
      
          PROMPT="Linode VM deployment configuration:
          CPU: $CPU
          RAM: $RAM
          OS: $OS
          Region: $REGION
          Workload: $WORKLOAD
          Plan Risk: $PLAN_RISK"
      
          RESPONSE=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "gpt-4.1-mini",
              messages: [
                {
                  role: "system",
                  content: "You are a senior cloud architect. Return output in exactly this format:\n\nRecommendations:\n<3 concise recommendations separated by commas>\n\nRisk Insight:\n<1 concise workload risk insight>\n\nRecommendations must be workload-aware:\n- database => backups, IOPS, monitoring\n- web => CDN, HTTPS, caching\n- AI => GPU and cost optimization\n- dev => snapshots and dev tooling"
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.3
            }' | curl -s https://api.openai.com/v1/chat/completions \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
                -d @-)
      
          AI_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
      
          echo "suggestion<<EOF" >> $GITHUB_OUTPUT
          echo "$AI_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Notify Slack
        if: success()
      
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IP: ${{ steps.get_ip.outputs.ip }}
          PASSWORD: ${{ steps.get_password.outputs.password }}
          AI: ${{ steps.aisuggestion.outputs.suggestion }}
          REGION: ${{ steps.deployment_inputs.outputs.region }}
          APPROVER: ${{ github.actor }}
      
        run: |
      
          MESSAGE=$(cat <<EOF
          *:white_check_mark: Linode successfully created!*

          *:white_check_mark: Approved By:*
          $APPROVER
          
          *:earth_africa: Region:*
          $REGION
          
          *:globe_with_meridians: Public IP:*
          $IP
          
          *:closed_lock_with_key: SSH Access:*
          ssh root@$IP
          
          *:shield: Root Password:*
          $PASSWORD
          
          
          *:bulb: AI Operational Insight:*
          $AI
          EOF
          )
      
          jq -n \
            --arg message "$MESSAGE" \
            '{
              text: "Deployment Success!",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $message
                  }
                }
              ]
            }' > slack.json
      
          curl -X POST \
            -H "Content-type: application/json" \
            --data @slack.json \
            "$SLACK_WEBHOOK_URL"
