name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:

    environment: production
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        run: terraform -chdir=terraform plan
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
        env:
          TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get Instance IP
        id: get_ip
        run: |
          IP=$(terraform -chdir=terraform output -raw instance_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Get Instance Password
        id: get_password
        run: |
          PASSWORD=$(terraform -chdir=terraform output -raw vm_password)
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Generate AI Suggestion
        id: ai_suggestion
        run: |

          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
            -s \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d '{
              "model": "gpt-4.1-mini",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a senior cloud architect."
                },
                {
                  "role": "user",
                  "content": "A Linode VM was deployed with type g6-nanode-1 running Debian 12 for a web application. Give concise operational recommendations."
                }
              ]
            }')

          AI_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          echo "suggestion<<EOF" >> $GITHUB_OUTPUT
          echo "$AI_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Slack
        if: success()
        shell: bash
        run: |

          IP="${{ steps.get_ip.outputs.ip }}"
          PASSWORD="${{ steps.get_password.outputs.password }}"
          AI="${{ steps.ai_suggestion.outputs.suggestion }}"

          MESSAGE=$(cat <<EOM
:white_check_mark: Linode successfully created!

:name_badge: Name: test123
:earth_africa: Public IP: ${IP}

:desktop_computer: Specs:
- Type: g6-nanode-1
- OS: Debian 12

:closed_lock_with_key: SSH Access:
ssh root@${IP}

:shield: Root Password:
${PASSWORD}

:bulb: AI Suggestion:
${AI}
EOM
)

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MESSAGE" '{text: $text}')" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
